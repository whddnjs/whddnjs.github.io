<p class="post-meta">
  <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%b %-d, %Y' }}</time>
  {% if page.updated %} · Updated <time datetime="{{ page.updated | date_to_xmlschema }}">{{ page.updated | date: '%b %-d, %Y' }}</time>{% endif %}
  · {{ include.reading_time }} min read
</p>
