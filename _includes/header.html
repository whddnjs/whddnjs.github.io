<header class="site-header">
  <div class="header-inner container">
    <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="desktop-nav" aria-label="주요 메뉴">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/tags/' | relative_url }}">Tags</a>
      <a href="{{ '/archive/' | relative_url }}">Archive</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
    <div class="header-actions">
      <button class="icon-button search-trigger" type="button" aria-label="검색 열기" aria-haspopup="dialog">Search</button>
      <button class="icon-button theme-toggle" type="button" aria-label="테마 변경" aria-haspopup="menu">Theme</button>
      <button class="icon-button menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="mobile-menu">☰</button>
    </div>
  </div>
  <nav class="mobile-nav container" id="mobile-menu" aria-label="모바일 메뉴" hidden>
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/tags/' | relative_url }}">Tags</a>
    <a href="{{ '/archive/' | relative_url }}">Archive</a>
    <a href="{{ '/about/' | relative_url }}">About</a>
  </nav>
  <div class="theme-menu" role="menu" hidden>
    <button type="button" role="menuitemradio" aria-checked="false" data-theme-choice="light">Light</button>
    <button type="button" role="menuitemradio" aria-checked="false" data-theme-choice="dark">Dark</button>
    <button type="button" role="menuitemradio" aria-checked="true" data-theme-choice="system">System</button>
  </div>
</header>
