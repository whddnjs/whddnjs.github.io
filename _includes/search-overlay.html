<section class="search-overlay" role="dialog" aria-modal="true" aria-labelledby="search-title" hidden>

    <div class="search-dialog-header">
      <h2 id="search-title">Search</h2>
      <button class="icon-button search-close" type="button" aria-label="검색 닫기">Close</button>
    </div>
    <label for="search-input">제목, 설명 또는 태그 검색</label>
    <input id="search-input" type="search" autocomplete="off" aria-controls="search-results">
    <p class="search-status" aria-live="polite"></p>
    <ul id="search-results" class="search-results"></ul>
  </div>
</section>
