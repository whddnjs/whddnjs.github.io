---
layout: default
---
<main id="main-content">
  <div class="container home">
    {% include hero.html %}
    <section class="latest-posts" aria-labelledby="latest-posts-title">
      <div class="section-heading">
        <h2 id="latest-posts-title">Latest Posts</h2>
      </div>
      {% assign posts = site.posts | slice: 0, 10 %}
      {% include post-list.html posts=posts %}
      <a class="text-link" href="{{ '/archive/' | relative_url }}">View all posts <span aria-hidden="true">→</span></a>
    </section>
  </div>
</main>
