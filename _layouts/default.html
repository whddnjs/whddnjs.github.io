<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'ko' }}" data-theme="system">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
    {% seo %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
    {% include header.html %}
    {{ content }}
    {% include footer.html %}
    <button class="back-to-top" type="button" aria-label="맨 위로 이동" hidden>↑</button>
    {% include search-overlay.html %}
    {% include search-index.html %}
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/lightbox.js' | relative_url }}" defer></script>
  </body>
</html>
